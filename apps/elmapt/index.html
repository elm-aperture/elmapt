<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090d" />
    <meta name="apple-mobile-web-app-title" content="Elm Aperture" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Photo and video for real estate, portraits and events in Dallas - Fort Worth."
    />

    <title>Elm Aperture - Photo &amp; Video</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elm Aperture" />
    <meta property="og:title" content="Elm Aperture - Photo &amp; Video" />
    <meta
      property="og:description"
      content="Photo and video for real estate, portraits and events in Dallas - Fort Worth."
    />
    <meta
      property="og:image"
      content="%MEDIA_BASE%/carousel/homepage_01.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1280" />
    <meta
      property="og:image:alt"
      content="Portrait of a woman in a black dress seated among dense foliage and orchids."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    %MEDIA_PRECONNECT%
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Libre+Caslon+Text:ital,wght@0,400;1,400&display=swap"
    />

    <link
      rel="preload"
      as="image"
      href="%MEDIA_BASE%/carousel/homepage_01.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
